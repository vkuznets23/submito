services:
  postgres:
    image: postgres:16
    container_name: submito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-submito}
      POSTGRES_USER: ${POSTGRES_USER:-submito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-submito}
    ports:
      - "5433:5432"
    volumes:
      - submito_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-submito} -d ${POSTGRES_DB:-submito}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: submito-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - submito_redisdata:/data

  app:
    build: .
    container_name: submito-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/submito
      DATABASE_USERNAME: submito
      DATABASE_PASSWORD: submito
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SECURITY_USER_NAME: ${SECURITY_USER_NAME:-admin}
      SECURITY_USER_PASSWORD: ${SECURITY_USER_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  submito_pgdata:
  submito_redisdata:
